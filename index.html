<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-key="indexPage.pageTitle">
      Home | Ahmed Mansour - Flutter Developer Portfolio
    </title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Montserrat:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>

  <body id="home-page">
    <div class="container header-container">
      <header class="portfolio-header">
        <div class="portfolio-cover">
          <div class="language-switcher">
            <button id="lang-en-btn">English</button>
            <button id="lang-ar-btn">العربية</button>
          </div>
        </div>
        <div class="profile-avatar-wrapper">
          <img
            src="assets/images/profile-pic.jpg"
            alt="Personal Photo"
            class="profile-pic"
          />
        </div>
        <div class="profile-info-header">
          <h1 data-i18n-key="indexPage.name">Ahmed Mohamed Mansour</h1>
          <h2 data-i18n-key="indexPage.jobTitle">Flutter Mobile Developer</h2>
          <p class="bio" data-i18n-key="indexPage.bio">
            Flutter Developer skilled in building responsive, high-performance mobile applications for both iOS and Android platforms.
          </p>
          <div class="social-links">
            <a
              href="https://github.com/Ahmedmansor"
              target="_blank"
              title="GitHub"
              ><i class="fab fa-github"></i
            ></a>
            <a
              href="https://linkedin.com/in/ahmed-mansour-343716209"
              target="_blank"
              title="LinkedIn"
              ><i class="fab fa-linkedin"></i
            ></a>
            <a href="mailto:ahmedmansour70000@gmail.com" title="Email"
              ><i class="fas fa-envelope"></i
            ></a>
          </div>
        </div>
      </header>
    </div>

    <!-- 3D GSAP Cylinder Carousel Section (Wide 4-Item Ring & Locked Pin Scroll) -->
    <section class="carousel-section" id="projects-carousel-section" carousel="component">
      <div class="carousel-viewport">
        
        <!-- 1. Top Title Zone (Layer on TOP, synchronized with scroll) -->
        <div class="carousel-title-zone">
          <div class="carousel-title-track" id="carousel-title-track">
            <!-- 4 synchronized title items populated via JS -->
          </div>
        </div>

        <!-- 2. Center 3D Stage (Wide Circular Stage) -->
        <div class="carousel-scene">
          <div class="carousel-wrap" carousel="wrap">
            <div class="carousel-cylinder" id="carousel-cylinder">
              <!-- 4 rich card widgets populated via JS -->
            </div>
          </div>
        </div>

        <!-- 3. Lower Controls Zone (Lime-Neon Arrows) -->
        <div class="carousel-controls-zone">
          <button class="carousel-arrow-btn prev-btn" id="carousel-prev" aria-label="Previous Project">
            <i class="fas fa-arrow-left"></i>
          </button>
          <button class="carousel-arrow-btn next-btn" id="carousel-next" aria-label="Next Project">
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>

      </div>
    </section>

    <div class="container footer-container">
      <footer>
        <p style="text-align: center">
          <span data-i18n-key="indexPage.contactMe"></span>
          <a href="mailto:ahmedmansour70000@gmail.com"
            >ahmedmansour70000@gmail.com</a
          >
          &nbsp;|&nbsp;
          <a
            href="https://wa.me/201000872150"
            target="_blank"
            title="WhatsApp"
            style="color: #25d366; font-weight: bold"
          >
            <i class="fab fa-whatsapp"></i> WhatsApp
          </a>
        </p>
      </footer>
    </div>

    <!-- Feature-First Clean Architecture Scripts -->
    <!-- 1. Core Layer -->
    <script src="src/core/domain/usecases/localization.usecase.js"></script>
    <script src="src/core/data/datasources/storage.datasource.js"></script>
    <script src="src/core/data/datasources/language.datasource.js"></script>
    <script src="src/core/data/repositories/language.repository.js"></script>
    <script src="src/core/presentation/components/language-switcher/language-switcher.component.js"></script>

    <!-- 2. Home Feature -->
    <script src="src/features/home/domain/models/project.model.js"></script>
    <script src="src/features/home/domain/usecases/carousel-geometry.usecase.js"></script>
    <script src="src/features/home/presentation/controllers/carousel.controller.js"></script>
    <script src="src/features/home/presentation/controllers/home.controller.js"></script>

    <script>
      // Initialize Home Page via Feature-First Controller
      document.addEventListener("DOMContentLoaded", () => {
        window.Portfolio.presentation.controllers.HomeController.init();
      });
    </script>
  </body>
</html>
