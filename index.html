<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-key="indexPage.pageTitle">
      Home | Ahmed Mansour - Flutter Developer Portfolio
    </title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Montserrat:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>

  <body id="home-page">
    <!-- Global Sticky App Bar -->
    <header id="appbar-container"></header>

    <div class="container header-container">
      <header class="portfolio-header">
        <div class="space-hero-stage" id="space-hero-stage">
          <div id="stars"></div>
          <div id="stars2"></div>
          <div id="stars3"></div>
          <div id="horizon">
            <div class="glow"></div>
          </div>
          <div id="earth"></div>
          <div id="title">AHMED MANSOUR</div>
          <div id="subtitle">
            <span>FLUTTER</span>
            <span>MOBILE</span>
            <span>DEVELOPER</span>
          </div>
        </div>
      </header>
    </div>

    <!-- 3D GSAP Cylinder Carousel Section (Wide 4-Item Ring & Locked Pin Scroll) -->
    <section class="carousel-section" id="projects-carousel-section" carousel="component">
      <div class="carousel-viewport">
        
        <!-- 1. Top Title Zone (Layer on TOP, synchronized with scroll) -->
        <div class="carousel-title-zone">
          <div class="carousel-title-track" id="carousel-title-track">
            <!-- 4 synchronized title items populated via JS -->
          </div>
        </div>

        <!-- 2. Center 3D Stage (Wide Circular Stage) -->
        <div class="carousel-scene">
          <div class="carousel-wrap" carousel="wrap">
            <div class="carousel-cylinder" id="carousel-cylinder">
              <!-- 4 rich card widgets populated via JS -->
            </div>
          </div>
        </div>

        <!-- 3. Lower Controls Zone (Lime-Neon Arrows) -->
        <div class="carousel-controls-zone">
          <button class="carousel-arrow-btn prev-btn" id="carousel-prev" aria-label="Previous Project">
            <i class="fas fa-arrow-left"></i>
          </button>
          <button class="carousel-arrow-btn next-btn" id="carousel-next" aria-label="Next Project">
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>

      </div>
    </section>

    <div class="container footer-container">
      <footer id="footer-container"></footer>
    </div>

    <!-- Feature-First Clean Architecture Scripts -->
    <!-- 1. Core Layer -->
    <script src="src/core/domain/usecases/localization.usecase.js"></script>
    <script src="src/core/data/datasources/storage.datasource.js"></script>
    <script src="src/core/data/datasources/language.datasource.js"></script>
    <script src="src/core/data/repositories/language.repository.js"></script>
    <script src="src/core/presentation/components/language-switcher/language-switcher.component.js"></script>
    <script src="src/core/presentation/components/appbar/appbar.component.js"></script>
    <script src="src/core/presentation/components/footer/footer.component.js"></script>

    <!-- 2. Home Feature -->
    <script src="src/features/home/domain/models/project.model.js"></script>
    <script src="src/features/home/domain/usecases/carousel-geometry.usecase.js"></script>
    <script src="src/features/home/presentation/controllers/carousel.controller.js"></script>
    <script src="src/features/home/presentation/controllers/home.controller.js"></script>

    <script>
      // Initialize Home Page via Feature-First Controller
      document.addEventListener("DOMContentLoaded", () => {
        window.Portfolio.presentation.controllers.HomeController.init();
      });
    </script>
  </body>
</html>
