<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-key="project1Page.pageTitle"></title>
    <link rel="stylesheet" href="style.css" />
    <!-- Swiper CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body id="project1-page">
    <!-- Global Sticky App Bar -->
    <header id="appbar-container"></header>

    <!-- Sticky Feature Navigation Bar -->
    <nav class="feature-nav" id="feature-nav">
      <ul></ul>
    </nav>
    <template id="gallery-item-template">
      <div class="gallery-item">
        <p class="media-caption"></p>
        <button class="see-more-btn" data-i18n-key="common.seeMore"></button>
        <video loop muted playsinline preload="none" class="lazy-video">
          <source src="" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
    </template>

    <div class="container">
      <header class="project-detail-header">
        <h1 data-i18n-key="project1Page.headerTitle"></h1>
        <p data-i18n-key="project1Page.headerDescription"></p>
        <div class="store-buttons-container">
          <a
            href="https://play.google.com/store/apps/details?id=com.app.linker.eg&pcampaignid=web_share&pli=1"
            target="_blank"
            rel="noopener noreferrer"
            class="google-play-btn"
            id="google-play-store-btn"
          >
            <i class="fab fa-google-play"></i>
            <div class="btn-text">
              <span class="btn-subtext" data-i18n-key="project1Page.playStoreSubtext">GET IT ON / TRY IT LIVE</span>
              <span class="btn-title" data-i18n-key="project1Page.playStoreTitle">Google Play</span>
            </div>
          </a>
        </div>
      </header>

      <main class="project-detail-content">
        <div class="feature-spotlight" id="feature1">
          <h4 data-i18n-key="project1Page.feature1Title"></h4>
          <p
            class="feature-description"
            data-i18n-key="project1Page.feature1Description"
          ></p>
          <!-- Swiper container for mobile, fallback to grid for desktop -->
          <div
            class="feature-media-gallery swiper-container"
            id="login-gallery"
          >
            <div class="swiper-wrapper"></div>
            <!-- Add Pagination -->
            <div class="swiper-pagination"></div>
          </div>
        </div>
        <div class="feature-spotlight" id="feature2">
          <h4 data-i18n-key="project1Page.feature2Title"></h4>
          <p
            class="feature-description"
            data-i18n-key="project1Page.feature2Description"
          ></p>
          <div
            class="feature-media-gallery swiper-container"
            id="registration-gallery"
          >
            <div class="swiper-wrapper"></div>
            <div class="swiper-pagination"></div>
          </div>
        </div>
        <div class="feature-spotlight" id="feature3">
          <h4 data-i18n-key="project1Page.feature3Title"></h4>
          <p
            class="feature-description"
            data-i18n-key="project1Page.feature3Description"
          ></p>
          <div
            class="feature-media-gallery swiper-container"
            id="profiles-gallery"
          >
            <div class="swiper-wrapper"></div>
            <div class="swiper-pagination"></div>
          </div>
          <div class="side-by-side-container">
            <h5 data-i18n-key="project1Page.feature3ComparisonTitle"></h5>
            <p data-i18n-key="project1Page.feature3ComparisonDescription"></p>
            <div class="zoomable-media-wrapper" id="comparison-zoom-wrapper" role="button" tabindex="0">
              <img
                src="assets/images/all-profiles-comparison.jpg"
                alt="Side-by-side comparison"
                loading="lazy"
                decoding="async"
              />
              <div class="zoom-magnifier-badge">
                <i class="fas fa-magnifying-glass-plus"></i>
                <span data-i18n-key="project1Page.tapToZoom">Tap to Zoom</span>
              </div>
            </div>
          </div>
        </div>
        <div class="feature-spotlight" id="feature4">
          <h4 data-i18n-key="project1Page.feature4Title"></h4>
          <p
            class="feature-description"
            data-i18n-key="project1Page.feature4Description"
          ></p>
          <div
            class="feature-media-gallery swiper-container"
            id="search-filter-gallery"
          >
            <div class="swiper-wrapper"></div>
            <div class="swiper-pagination"></div>
          </div>
        </div>
        <div class="feature-spotlight" id="feature5">
          <h4 data-i18n-key="project1Page.feature5Title"></h4>
          <p
            class="feature-description"
            data-i18n-key="project1Page.feature5Description"
          ></p>
          <div
            class="feature-media-gallery swiper-container"
            id="become-coach-gallery"
          >
            <div class="swiper-wrapper"></div>
            <div class="swiper-pagination"></div>
          </div>
        </div>
        <div class="feature-spotlight" id="feature6">
          <h4 data-i18n-key="project1Page.feature6Title"></h4>
          <p
            class="feature-description"
            data-i18n-key="project1Page.feature6Description"
          ></p>
          <div
            class="feature-media-gallery swiper-container"
            id="session-gallery"
          >
            <div class="swiper-wrapper"></div>
            <div class="swiper-pagination"></div>
          </div>
        </div>
      </main>

      <!-- Universal Footer Contact Dock -->
      <div class="container footer-container">
        <footer id="footer-container"></footer>
      </div>
    </div>

    <!-- Image Lightbox Modal for Full-Resolution Mobile & Desktop Inspection -->
    <div class="image-lightbox-modal" id="image-lightbox-modal" aria-hidden="true" role="dialog">
      <div class="lightbox-overlay" id="lightbox-overlay"></div>
      <div class="lightbox-container">
        <button class="lightbox-close-btn" id="lightbox-close-btn" aria-label="Close Preview">
          <i class="fas fa-times"></i>
        </button>
        <div class="lightbox-scroll-area">
          <img
            src="assets/images/all-profiles-comparison.jpg"
            alt="All Profiles Full Comparison"
            class="lightbox-image"
            loading="lazy"
            decoding="async"
          />
        </div>
        <p class="lightbox-caption" data-i18n-key="project1Page.lightboxHint">
          High-resolution comparison of Guest, Player & Coach roles • Tap ✕ or outside to close
        </p>
      </div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Feature-First Clean Architecture Scripts -->
    <!-- 1. Core Layer -->
    <script src="src/core/domain/usecases/localization.usecase.js"></script>
    <script src="src/core/data/datasources/storage.datasource.js"></script>
    <script src="src/core/data/datasources/language.datasource.js"></script>
    <script src="src/core/data/repositories/language.repository.js"></script>
    <script src="src/core/presentation/components/language-switcher/language-switcher.component.js"></script>
    <script src="src/core/presentation/components/appbar/appbar.component.js"></script>
    <script src="src/core/presentation/components/footer/footer.component.js"></script>

    <!-- 2. Linker Feature -->
    <script src="src/features/linker/presentation/controllers/linker.controller.js"></script>

    <script>
      // Initialize Linker EG Detail Page via Feature-First Controller
      document.addEventListener("DOMContentLoaded", () => {
        window.Portfolio.presentation.controllers.LinkerController.init();
      });
    </script>
  </body>
</html>
